name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: app/frontend-next
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.23.1
          cache: npm
          cache-dependency-path: app/frontend-next/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit production dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_MODE: demo
      DATABASE_URL: sqlite://
      PYTHONPATH: .
      SEED_DEMO_DATA: "false"
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.11.9
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pip==26.1.2 setuptools==83.0.0
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Audit Python dependencies
        run: pip-audit --requirement requirements.lock --progress-spinner off

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  rag-pgvector:
    name: RAG v2 PostgreSQL/pgvector
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tickety
          POSTGRES_PASSWORD: tickety-ci
          POSTGRES_DB: tickety
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tickety -d tickety"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_MODE: production
      DATABASE_URL: postgresql+psycopg2://tickety:tickety-ci@127.0.0.1:5432/tickety
      PYTHONPATH: .
      TICKET_EMBEDDING_DIMENSIONS: "3"
      TICKET_EMBEDDING_ENABLED: "false"
      TICKET_RAG_SCOPE_KEY: integration
      TICKET_RAG_V2_SCOPE_ALLOWLIST: integration
      TICKET_RAG_V2_WRITE_ENABLED: "true"
      TICKET_RAG_V2_READ_ENABLED: "true"
      TICKETY_RAG_PGVECTOR_TESTS: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.11.9
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run pgvector integration tests
        run: python -m unittest tests.test_rag_v2_postgres -v

  manifests:
    name: Deployment artifacts
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: 3.11.9

      - name: Install manifest decoder
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3

      - name: Install Helm
        run: |
          helm_version=3.17.3
          helm_archive="helm-v${helm_version}-linux-amd64.tar.gz"
          helm_sha256=ee88b3c851ae6466a3de507f7be73fe94d54cbf2987cbaa3d1a3832ea331f2cd
          curl --fail --silent --show-error --location --retry 3 \
            "https://get.helm.sh/${helm_archive}" --output "/tmp/${helm_archive}"
          printf '%s  %s\n' "$helm_sha256" "/tmp/${helm_archive}" | sha256sum --check --strict
          tar --extract --gzip --file "/tmp/${helm_archive}" --directory /tmp
          install --mode=0755 /tmp/linux-amd64/helm /usr/local/bin/helm

      - name: Validate deployment configuration
        run: ./scripts/validate-deployment.sh --require-docker --require-helm --require-kubectl --require-yaml
