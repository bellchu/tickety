name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository:
    name: Public repository safety
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Validate public tree
        run: scripts/validate-public-repository.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    defaults:
      run:
        working-directory: app/frontend-next
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: app/frontend-next/package-lock.json

      - name: Install dependencies
        run: npm ci && npm ls --all

      - name: Audit production dependencies (high and critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify production routes
        run: npm run verify:production-routes

  freshworks-app:
    name: Freshworks app
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: freshworks-app
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.11.0
          cache: npm
          cache-dependency-path: freshworks-app/package-lock.json

      - name: Install dependencies
        run: |
          # Node 24.11.0 bundles npm 11.6.1, which matches FDK 10's npm 11
          # support lane. Keep this exact assertion paired with the pinned Node.
          npm --version | grep -Fx '11.6.1'
          npm ci
          npm ls --all

      - name: Audit dependencies (high and critical)
        run: npm audit --audit-level=high

      - name: Install supported Freshworks FDK
        run: |
          npm --version | grep -Eq '^11[.]'
          # This is Freshworks' Node 24 distribution channel. The exact-version
          # assertion below intentionally fails on upstream drift until the
          # manifest and release gate have been reviewed together.
          npm install --global https://cdn.freshdev.io/fdk/latest-v24.tgz
          TICKETY_FDK_VERSION="$(fdk version)"
          printf '%s\n' "$TICKETY_FDK_VERSION"
          printf '%s\n' "$TICKETY_FDK_VERSION" | grep -Eq '(^|[^0-9])10[.]1[.]9([^0-9]|$)'

      - name: Run Freshworks tests and record the FDK report
        run: fdk unit-test

      - name: Validate Freshworks app
        run: |
          fdk validate
          git diff --exit-code -- manifest.json package.json

      - name: Build and verify Freshworks package
        run: |
          rm -f dist/freshworks-app.zip
          npm run fdk-package
          test -f dist/freshworks-app.zip
          bash scripts/verify-package.sh dist/freshworks-app.zip

  backend:
    name: Backend
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      APP_MODE: demo
      DATABASE_URL: sqlite://
      PYTHONPATH: .
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.16
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --disable-pip-version-check pip==26.2.1 setuptools==84.0.0
          python -m pip install --disable-pip-version-check -r requirements.lock
          python -m pip install --disable-pip-version-check pip-audit==2.10.1

      - name: Audit Python dependencies
        run: pip-audit --requirement requirements.lock --progress-spinner off

      - name: Compile Python sources
        run: python -m compileall -q app tests

      - name: Run unit tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v

  rag-pgvector:
    name: RAG v2 PostgreSQL/pgvector
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg16
        env:
          POSTGRES_USER: tickety
          POSTGRES_PASSWORD: tickety-ci
          POSTGRES_DB: tickety
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tickety -d tickety"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      APP_MODE: production
      DATABASE_URL: postgresql+psycopg2://tickety:tickety-ci@127.0.0.1:5432/tickety
      PYTHONPATH: .
      TICKET_EMBEDDING_DIMENSIONS: "3"
      TICKET_EMBEDDING_ENABLED: "false"
      TICKET_RAG_SCOPE_KEY: integration
      TICKET_RAG_V2_SCOPE_ALLOWLIST: integration
      TICKET_RAG_V2_WRITE_ENABLED: "true"
      TICKET_RAG_V2_READ_ENABLED: "true"
      TICKETY_RAG_PGVECTOR_TESTS: "true"
      TICKETY_POSTGRES_INTEGRATION_TESTS: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.16
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run PostgreSQL integration tests
        run: python -m unittest tests.test_rag_v2_postgres tests.test_notification_outbox_postgres -v

  deployment:
    name: Production deployment gate
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      POSTGRES_PASSWORD: tickety-ci-validation
      DATABASE_URL: postgresql+psycopg2://tickety:tickety-ci-validation@postgres:5432/tickety
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.11.16

      - name: Validate deployment configuration
        run: ./scripts/validate-deployment.sh --require-docker --require-helm

      - name: Validate isolated dev deployment configuration
        run: ./scripts/validate-dev-deployment.sh
