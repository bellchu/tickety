apiVersion: v1
kind: Pod
metadata:
  name: {{ include "tickety.fullname" . }}-test-connection
  labels:
    {{- include "tickety.labels" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: healthcheck
      image: {{ printf "%s:%s" .Values.frontend.image.repository (.Values.frontend.image.tag | default .Chart.AppVersion) | quote }}
      imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
      command:
        - node
        - -e
        - >-
          fetch('http://{{ include "tickety.fullname" . }}-frontend:{{ .Values.frontend.service.port }}/api/health/ready')
          .then(async response => { if (!response.ok) throw new Error(await response.text()); return response.text(); })
          .then(console.log)
          .catch(error => { console.error(error.message); process.exit(1); });
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: ["ALL"]
  {{- with .Values.imagePullSecrets }}
  imagePullSecrets:
    {{- toYaml . | nindent 4 }}
  {{- end }}
