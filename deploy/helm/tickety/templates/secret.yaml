{{- if not .Values.existingSecret }}
{{- $name := include "tickety.secretName" . }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $existingPassword := "" }}
{{- $existingDatabaseUrl := "" }}
{{- if and $existing $existing.data }}
  {{- if hasKey $existing.data "POSTGRES_PASSWORD" }}
    {{- $existingPassword = index $existing.data "POSTGRES_PASSWORD" | b64dec }}
  {{- end }}
  {{- if hasKey $existing.data "DATABASE_URL" }}
    {{- $existingDatabaseUrl = index $existing.data "DATABASE_URL" | b64dec }}
  {{- end }}
{{- end }}
{{- $password := coalesce $existingPassword .Values.postgresql.auth.password (randAlphaNum 32) }}
{{- $databaseUrl := coalesce .Values.postgresql.externalDatabaseUrl $existingDatabaseUrl }}
{{- if .Values.postgresql.enabled }}
  {{- if not .Values.postgresql.externalDatabaseUrl }}
    {{- $databaseUrl = printf "postgresql+psycopg2://%s:%s@%s:5432/%s" (.Values.postgresql.auth.username | urlquery) ($password | urlquery) (include "tickety.postgresqlName" .) (.Values.postgresql.auth.database | urlquery) }}
  {{- end }}
{{- else if not $databaseUrl }}
  {{- fail "postgresql.externalDatabaseUrl is required when postgresql.enabled=false and existingSecret is not set" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "tickety.labels" . | nindent 4 }}
type: Opaque
stringData:
  DATABASE_URL: {{ $databaseUrl | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  {{- range $key, $value := .Values.secrets }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
