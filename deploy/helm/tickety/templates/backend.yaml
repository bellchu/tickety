apiVersion: v1
kind: Service
metadata:
  name: {{ include "tickety.fullname" . }}-backend
  labels:
    {{- include "tickety.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  selector:
    {{- include "tickety.componentLabels" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tickety.fullname" . }}-backend
  labels:
    {{- include "tickety.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  replicas: {{ .Values.backend.replicaCount }}
  revisionHistoryLimit: 3
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "tickety.componentLabels" (dict "root" . "component" "backend") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- include "tickety.existingSecretRolloutAnnotations" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "tickety.componentLabels" (dict "root" . "component" "backend") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- if .Values.backend.topologySpread.enabled }}
      topologySpreadConstraints:
        - maxSkew: {{ .Values.backend.topologySpread.maxSkew }}
          topologyKey: {{ .Values.backend.topologySpread.topologyKey | quote }}
          whenUnsatisfiable: {{ .Values.backend.topologySpread.whenUnsatisfiable }}
          labelSelector:
            matchLabels:
              {{- include "tickety.componentLabels" (dict "root" . "component" "backend") | nindent 14 }}
      {{- end }}
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- include "tickety.waitForSchema" . | nindent 8 }}
      containers:
        - name: backend
          image: {{ include "tickety.backendImage" . | quote }}
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          command: ["uvicorn", "app.backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
          envFrom:
            - configMapRef:
                name: {{ include "tickety.configName" . }}
            - secretRef:
                name: {{ include "tickety.secretName" . }}
          env:
            - name: TICKETY_PROCESS_ROLE
              value: api
          ports:
            - name: http
              containerPort: 8000
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 2
            timeoutSeconds: 2
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 5"]
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
{{- if .Values.worker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tickety.fullname" . }}-worker
  labels:
    {{- include "tickety.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tickety.componentLabels" (dict "root" . "component" "worker") | nindent 6 }}
  template:
    metadata:
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- include "tickety.existingSecretRolloutAnnotations" . | nindent 8 }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "tickety.componentLabels" (dict "root" . "component" "worker") | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      # The process caps cooperative shutdown at 30s; leave Kubernetes enough
      # headroom to complete termination without extending a node drain.
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        {{- include "tickety.waitForSchema" . | nindent 8 }}
      containers:
        - name: worker
          image: {{ include "tickety.workerImage" . | quote }}
          imagePullPolicy: {{ include "tickety.workerPullPolicy" . }}
          command: ["python", "-m", "app.backend.worker"]
          envFrom:
            - configMapRef:
                name: {{ include "tickety.configName" . }}
            - secretRef:
                name: {{ include "tickety.secretName" . }}
          env:
            - name: TICKETY_PROCESS_ROLE
              value: worker
            - name: WORKER_SHUTDOWN_DEADLINE_SECONDS
              value: {{ .Values.worker.shutdownDeadlineSeconds | quote }}
            - name: WORKER_HEALTHCHECK_MAX_AGE_SECONDS
              value: {{ .Values.worker.healthcheckMaxAgeSeconds | quote }}
          startupProbe:
            exec:
              command: ["python", "-m", "app.backend.worker", "--healthcheck"]
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command: ["python", "-m", "app.backend.worker", "--healthcheck"]
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            exec:
              command: ["python", "-m", "app.backend.worker", "--healthcheck"]
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
