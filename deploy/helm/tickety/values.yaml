nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

# The production installer enables this gate and supplies registry manifest
# digests. Local/evaluation chart renders can retain tag references.
imageDigestPolicy:
  requireDigests: false

backend:
  replicaCount: 1
  topologySpread:
    enabled: false
    topologyKey: kubernetes.io/hostname
    maxSkew: 1
    whenUnsatisfiable: DoNotSchedule
  image:
    repository: tickety-backend
    # `dev` is only for a local/evaluation chart render. Production values must
    # supply a build-specific tag (the repository deployer does this for you).
    tag: dev
    digest: ""
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

worker:
  enabled: true
  # Admission closes immediately on SIGTERM. This is deliberately below the
  # worker Pod's 45-second termination grace, leaving Kubernetes headroom.
  shutdownDeadlineSeconds: 20
  # A heartbeat is written only after a scheduled callback completes. Kubernetes
  # restarts a worker whose scheduler or executor stops making progress.
  healthcheckMaxAgeSeconds: 120
  # The worker always runs the backend image that the migration Job verifies.
  # Repository/tag overrides must exactly match backend.image and otherwise
  # fail rendering, so an independently-versioned worker cannot outrun schema.
  image: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

frontend:
  replicaCount: 1
  topologySpread:
    enabled: false
    topologyKey: kubernetes.io/hostname
    maxSkew: 1
    whenUnsatisfiable: DoNotSchedule
  image:
    repository: tickety-frontend
    # Keep the chart usable for local evaluation without making a floating tag
    # appear to be a production-safe default.
    tag: dev
    digest: ""
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: tickety.example.com
  path: /
  tls: []

# Use an existing Secret instead of having the chart manage one. It must contain
# DATABASE_URL, TICKETY_SETTINGS_ENCRYPTION_ACTIVE_KID,
# TICKETY_SETTINGS_ENCRYPTION_KEYS_JSON, and, when postgresql.enabled=true,
# POSTGRES_PASSWORD. The chart cannot safely inspect externally managed Secret
# data during an install or dry-run; the migration Job fails closed if either
# settings-encryption key is absent or invalid.
existingSecret: ""
# For a Secret managed outside Helm, change this non-secret token after each
# credential rotation to roll backend and worker Pods. The chart never reads or
# hashes the external Secret.
existingSecretRolloutToken: ""

# Sensitive application settings are written to the chart-managed Secret. When
# existingSecret is empty, both TICKETY_SETTINGS_ENCRYPTION_ACTIVE_KID and
# TICKETY_SETTINGS_ENCRYPTION_KEYS_JSON are required here at render time so the
# migration preflight never starts without its deployment-owned keyring. Supply
# them through an uncommitted secret values source; production should normally
# use existingSecret from a secret manager instead.
# A stable, alphanumeric PostgreSQL password is generated on first install when
# postgresql.auth.password is empty and is reused on subsequent upgrades.
secrets: {}

config:
  # The bare chart is an evaluation baseline. Production values and deploy.sh
  # select production explicitly, which then makes digest pinning mandatory.
  appMode: demo
  deploymentClass: poc
  loginRequired: true
  frontendUrl: https://tickety.example.com
  corsAllowOrigins: https://tickety.example.com
  cookieSecure: true
  cookieSameSite: lax
  # `auto` selects raw-write compatibility only for a Helm upgrade, where a
  # legacy API Pod can overlap. New Helm installs select `hashed`. After a
  # bridge upgrade, explicitly set `hashed` to stop raw writes; existing
  # bounded legacy sessions remain readable only until their normal expiry.
  sessionStorageMode: auto
  sso:
    enabled: false
    # Presets: entra or okta. Use oidc plus discoveryUrl for another public
    # OpenID Connect provider. The redirect URI is derived from frontendUrl.
    provider: entra
    clientId: ""
    entraTenantId: ""
    oktaDomain: ""
    oktaAuthServerId: org
    discoveryUrl: ""
    allowedDomains: ""
    # Comma-separated immutable provider group IDs. For Entra, use group Object IDs.
    allowedGroupIds: ""
    autoProvision: false
  ragV2:
    scopeKey: default
    scopeAllowlist: default
    writeEnabled: false
    workerEnabled: false
    readEnabled: false
    chunkTargetTokens: 450
    chunkMaxTokens: 600
    chunkOverlapTokens: 50
    embedBatchSize: 32
    embedLeaseSeconds: 120
    workerPollSeconds: 2
    queryCacheTtlSeconds: 2700
    queryCacheMaxRows: 50000
    snapshotTtlSeconds: 86400
    # API/all processes independently run one bounded expiry batch at this
    # interval. This deployment-owned setting is intentionally not editable
    # through the administrator settings store.
    retentionPollSeconds: 300
  # Non-secret realtime outbox controls. Each API replica polls the shared
  # database independently, then delivers only to its own authenticated WS clients.
  notificationOutboxPollSeconds: 1
  notificationOutboxBatchSize: 100
  notificationOutboxReplayBatchSize: 100
  notificationOutboxRetentionSeconds: 3600
  notificationOutboxPruneIntervalSeconds: 300
  notificationOutboxStaleSeconds: 30
  notificationOutboxPruneBatchSize: 5000
  notificationOutboxPruneBatchesPerRun: 4
  aiRetentionCleanupBatchSize: 500
  aiRetentionCleanupMaxRowsPerStart: 5000
  # Escape-hatch settings are rendered into a public ConfigMap. Sensitive or
  # reserved names (for example *_SECRET, *_TOKEN, *_KEY, credentials, and the
  # settings-encryption keyring) are rejected by both schema and template.
  # Put every credential in secrets or the externally managed existingSecret.
  extra: {}

postgresql:
  enabled: true
  image:
    repository: pgvector/pgvector
    # Keep the database image aligned with the verified Compose/dev image.
    # Never use a floating major-only or `latest` tag for persistent storage.
    tag: 0.8.6-pg16
    # Required when production digest policy is enabled and this bundled
    # PostgreSQL StatefulSet (or its backup CronJob) is rendered.
    digest: ""
    pullPolicy: IfNotPresent
  auth:
    username: tickety
    password: ""
    database: tickety
  # Required when postgresql.enabled=false unless existingSecret supplies it.
  externalDatabaseUrl: ""
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

migration:
  activeDeadlineSeconds: 600
  backoffLimit: 3
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Scheduled backups are available for the bundled PostgreSQL instance. Enable
# this explicitly after choosing a retention period and backup volume size.
backup:
  enabled: false
  schedule: "17 3 * * *"
  retentionDays: 14
  activeDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  persistence:
    size: 8Gi
    storageClass: ""
    existingClaim: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

networkPolicy:
  enabled: true
  allowPublicHttpsEgress: true
  # Raw Kubernetes NetworkPolicy egress entries for private databases or
  # private AI/ITSM endpoints. Prefer narrow pod/namespace or ipBlock selectors.
  additionalEgress: []

podAnnotations: {}
podLabels: {}
