nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

backend:
  replicaCount: 1
  image:
    repository: tickety-backend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

worker:
  enabled: true
  image: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

frontend:
  replicaCount: 1
  image:
    repository: tickety-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: tickety.nexora.com
  path: /
  tls: []

# Use an existing Secret instead of having the chart manage one. It must contain
# DATABASE_URL and, when postgresql.enabled=true, POSTGRES_PASSWORD.
existingSecret: ""
# For a Secret managed outside Helm, change this non-secret token after each
# credential rotation to roll backend and worker Pods. The chart never reads or
# hashes the external Secret.
existingSecretRolloutToken: ""

# Sensitive application settings are written to the chart-managed Secret.
# A stable, alphanumeric PostgreSQL password is generated on first install when
# postgresql.auth.password is empty and is reused on subsequent upgrades.
secrets: {}

config:
  appMode: demo
  deploymentClass: production
  seedDemoData: ""
  loginRequired: false
  frontendUrl: ""
  corsAllowOrigins: ""
  cookieSecure: false
  cookieSameSite: lax
  sso:
    enabled: false
    # Presets: entra or okta. Use oidc plus discoveryUrl for another public
    # OpenID Connect provider. The redirect URI is derived from frontendUrl.
    provider: entra
    clientId: ""
    entraTenantId: ""
    oktaDomain: ""
    oktaAuthServerId: org
    discoveryUrl: ""
    allowedDomains: ""
    # Comma-separated immutable provider group IDs. For Entra, use group Object IDs.
    allowedGroupIds: ""
    autoProvision: false
  ragV2:
    scopeKey: default
    scopeAllowlist: default
    writeEnabled: false
    workerEnabled: false
    readEnabled: false
    chunkTargetTokens: 450
    chunkMaxTokens: 600
    chunkOverlapTokens: 50
    embedBatchSize: 32
    embedLeaseSeconds: 120
    workerPollSeconds: 2
    queryCacheTtlSeconds: 2700
    queryCacheMaxRows: 50000
    snapshotTtlSeconds: 86400
  extra: {}

postgresql:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: pg16
    pullPolicy: IfNotPresent
  auth:
    username: tickety
    password: ""
    database: tickety
  # Required when postgresql.enabled=false unless existingSecret supplies it.
  externalDatabaseUrl: ""
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

migration:
  activeDeadlineSeconds: 600
  backoffLimit: 3
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

# Scheduled backups are available for the bundled PostgreSQL instance. Enable
# this explicitly after choosing a retention period and backup volume size.
backup:
  enabled: false
  schedule: "17 3 * * *"
  retentionDays: 14
  activeDeadlineSeconds: 1800
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  persistence:
    size: 8Gi
    storageClass: ""
    existingClaim: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

networkPolicy:
  enabled: true
  allowPublicHttpsEgress: true
  # Raw Kubernetes NetworkPolicy egress entries for private databases or
  # private AI/ITSM endpoints. Prefer narrow pod/namespace or ipBlock selectors.
  additionalEgress: []

podAnnotations: {}
podLabels: {}
