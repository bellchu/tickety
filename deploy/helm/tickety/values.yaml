nameOverride: ""
fullnameOverride: ""

imagePullSecrets: []

backend:
  replicaCount: 1
  image:
    repository: tickety-backend
    tag: latest
    pullPolicy: IfNotPresent
  resources:
    requests:
      cpu: 200m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

worker:
  enabled: true
  image: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

frontend:
  replicaCount: 1
  image:
    repository: tickety-frontend
    tag: latest
    pullPolicy: IfNotPresent
  service:
    type: ClusterIP
    port: 80
    annotations: {}
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 768Mi

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: tickety.example.com
  path: /
  tls: []

# Use an existing Secret instead of having the chart manage one. It must contain
# DATABASE_URL and, when postgresql.enabled=true, POSTGRES_PASSWORD.
existingSecret: ""

# Sensitive application settings are written to the chart-managed Secret.
# A stable, alphanumeric PostgreSQL password is generated on first install when
# postgresql.auth.password is empty and is reused on subsequent upgrades.
secrets: {}

config:
  appMode: demo
  seedDemoData: ""
  loginRequired: false
  frontendUrl: ""
  corsAllowOrigins: ""
  cookieSecure: false
  cookieSameSite: lax
  extra: {}

postgresql:
  enabled: true
  image:
    repository: pgvector/pgvector
    tag: pg16
    pullPolicy: IfNotPresent
  auth:
    username: tickety
    password: ""
    database: tickety
  # Required when postgresql.enabled=false unless existingSecret supplies it.
  externalDatabaseUrl: ""
  persistence:
    enabled: true
    size: 8Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

migration:
  activeDeadlineSeconds: 600
  backoffLimit: 3
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

networkPolicy:
  enabled: true
  allowPublicHttpsEgress: true
  # Raw Kubernetes NetworkPolicy egress entries for private databases or
  # private AI/ITSM endpoints. Prefer narrow pod/namespace or ipBlock selectors.
  additionalEgress: []

podAnnotations: {}
podLabels: {}
