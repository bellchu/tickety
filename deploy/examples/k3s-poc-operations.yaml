# Operational resources for the existing tickety-standalone k3s POC. These
# resources deliberately do not take ownership of the existing workloads.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: tickety-postgres-backups
  namespace: tickety-standalone
  labels:
    app.kubernetes.io/name: tickety
    app.kubernetes.io/component: backup
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: tickety-postgres-backup
  namespace: tickety-standalone
  labels:
    app.kubernetes.io/name: tickety
    app.kubernetes.io/component: backup
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 1800
      ttlSecondsAfterFinished: 86400
      template:
        metadata:
          labels:
            app.kubernetes.io/name: tickety
            app.kubernetes.io/component: backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            fsGroup: 70
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: backup
              image: postgres:16-alpine
              imagePullPolicy: IfNotPresent
              command:
                - /bin/sh
                - -ec
                - |
                  umask 077
                  timestamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  temporary="/backups/.tickety-${timestamp}.dump.tmp"
                  destination="/backups/tickety-${timestamp}.dump"
                  database_ready=false
                  for attempt in $(seq 1 30); do
                    if pg_isready --host=postgres --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" >/dev/null; then
                      database_ready=true
                      break
                    fi
                    sleep 2
                  done
                  if [ "$database_ready" != true ]; then
                    echo "PostgreSQL did not become reachable before backup" >&2
                    exit 1
                  fi
                  pg_dump --format=custom --host=postgres --username="$POSTGRES_USER" --dbname="$POSTGRES_DB" --file="$temporary"
                  pg_restore --list "$temporary" >/dev/null
                  mv "$temporary" "$destination"
                  find /backups -type f -name 'tickety-*.dump' -mtime +14 -delete
              env:
                - name: POSTGRES_USER
                  value: tickety
                - name: POSTGRES_DB
                  value: tickety
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: tickety-secrets
                      key: POSTGRES_PASSWORD
              resources:
                requests:
                  # This POC node has only 40m of currently unreserved CPU.
                  # Keep the scheduled backup placeable without removing its
                  # memory guarantee or CPU limit.
                  cpu: 25m
                  memory: 128Mi
                limits:
                  cpu: 500m
                  memory: 512Mi
              securityContext:
                runAsUser: 70
                runAsGroup: 70
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: backups
                  mountPath: /backups
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: backups
              persistentVolumeClaim:
                claimName: tickety-postgres-backups
            - name: tmp
              emptyDir:
                sizeLimit: 64Mi
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-restricted-ingress
  namespace: tickety-standalone
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tickety
      app.kubernetes.io/component: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tickety
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values:
                  - backend
                  - backend-worker
                  - migration
                  - migrate
                  - backup
      ports:
        - protocol: TCP
          port: 5432
