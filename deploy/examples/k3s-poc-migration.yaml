apiVersion: batch/v1
kind: Job
metadata:
  name: tickety-migrate-poc-20260808-02
  namespace: tickety-standalone
  labels:
    app.kubernetes.io/name: tickety
    app.kubernetes.io/component: migration
    app.kubernetes.io/version: poc-20260808-01
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tickety
        app.kubernetes.io/component: migration
        app.kubernetes.io/version: poc-20260808-01
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: wait-for-postgres
          image: docker.io/library/tickety-backend:poc-20260808-01
          imagePullPolicy: Never
          command:
            - python
            - -c
            - |
              import os
              import time
              import psycopg2

              url = os.environ["DATABASE_URL"].replace(
                  "postgresql+psycopg2://", "postgresql://"
              )
              for attempt in range(30):
                  try:
                      connection = psycopg2.connect(url, connect_timeout=3)
                      connection.close()
                      break
                  except Exception:
                      if attempt == 29:
                          raise
                      time.sleep(2)
          envFrom:
            - secretRef:
                name: tickety-secrets
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: migrate
          image: docker.io/library/tickety-backend:poc-20260808-01
          imagePullPolicy: Never
          command: ["alembic", "upgrade", "head"]
          envFrom:
            - secretRef:
                name: tickety-secrets
          env:
            - name: TICKETY_DEPLOYMENT_CLASS
              value: poc
          resources:
            requests:
              cpu: 25m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
