# Copy this file outside the repository, replace every example hostname, and
# keep real credentials in a secret manager or an uncommitted values file.

config:
  appMode: production
  seedDemoData: "false"
  loginRequired: true
  frontendUrl: https://tickety.nexora.com
  corsAllowOrigins: https://tickety.nexora.com
  cookieSecure: true
  cookieSameSite: lax
  # Entra example (see docs/sso.md); keep the real secret outside this file:
  # sso:
  #   enabled: true
  #   provider: entra
  #   clientId: <application-client-id>
  #   entraTenantId: <directory-tenant-id-guid>
  #   oktaDomain: ""
  #   oktaAuthServerId: org
  #   discoveryUrl: ""
  #   allowedDomains: example.com
  #   autoProvision: false
  extra:
    ITSM_PROVIDER: freshservice
    FRESHSERVICE_OAUTH_SCOPES: "freshservice.tickets.view freshservice.agents.manage freshservice.requesters.view"

frontend:
  service:
    type: ClusterIP

ingress:
  enabled: true
  className: nginx
  host: tickety.nexora.com
  tls:
    - secretName: tickety-tls
      hosts:
        - tickety.nexora.com

postgresql:
  enabled: true
  persistence:
    enabled: true
    size: 20Gi
    # Set the storage class required by your cluster, such as managed-csi on AKS.
    storageClass: ""

# Examples only; add real values such as SSO_CLIENT_SECRET through a secret
# manager or private values file.
secrets: {}
