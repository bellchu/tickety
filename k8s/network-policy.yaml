apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-safe-egress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [backend, backend-worker]
  policyTypes: [Egress]
  egress:
    # Cluster DNS.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # Tickety's database is the only private-network destination required by
    # the backend. This exception is pod-scoped, not CIDR-scoped.
    - to:
        - podSelector:
            matchLabels:
              app: postgres
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tickety
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    # Public IPv4 egress for configured ITSM and AI providers. Excluding every
    # private, link-local, loopback, benchmark, documentation, multicast, and
    # reserved block makes DNS rebinding to an internal address fail at connect.
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.88.99.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - protocol: TCP
          port: 443
---
# Postgres accepts connections only from backend, worker, and migration pods.
# Without this, any pod in the namespace (including the publicly exposed
# frontend) can reach the database directly.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-restricted-ingress
spec:
  podSelector:
    matchExpressions:
      - key: app
        operator: In
        values: [postgres]
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [backend, backend-worker, tickety-migrate]
        - podSelector:
            matchExpressions:
              - key: app.kubernetes.io/component
                operator: In
                values: [backend, backend-worker, migrate]
      ports:
        - protocol: TCP
          port: 5432
---
# Public/remote manifests use the standard app.kubernetes.io label set while
# the local OrbStack manifests retain their shorter historical labels.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-safe-egress-standard-labels
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tickety
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [backend, backend-worker]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app: postgres
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: tickety
              app.kubernetes.io/component: postgres
      ports:
        - protocol: TCP
          port: 5432
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.88.99.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/4
              - 240.0.0.0/4
      ports:
        - protocol: TCP
          port: 443
