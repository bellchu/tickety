apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: tickety
spec:
  replicas: 1
  revisionHistoryLimit: 3
  minReadySeconds: 5
  progressDeadlineSeconds: 300
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: frontend
        image: tickety-frontend:latest
        imagePullPolicy: Never
        ports:
        - name: http
          containerPort: 3000
        env:
        - name: NEXT_PUBLIC_API_URL
          value: "http://backend-service:8000"
        - name: NEXT_PUBLIC_WS_URL
          value: "ws://backend-service:8000"
        # Server-only runtime env for the /api proxy route handler.
        # NEXT_PUBLIC_* vars are inlined at build time and ignore pod env, so
        # the route handler reads this non-public var at request time instead.
        - name: BACKEND_URL
          value: "http://backend-service:8000"
        # Server-only public origin for absolute metadata URLs. Keep it aligned
        # with the backend's deployment-owned FRONTEND_URL setting.
        - name: SITE_URL
          valueFrom:
            secretKeyRef:
              name: tickety-secrets
              key: FRONTEND_URL
        startupProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 2
          timeoutSeconds: 2
          failureThreshold: 45
        readinessProbe:
          httpGet:
            path: /api/health/ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1
        livenessProbe:
          httpGet:
            path: /
            port: http
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 5"]
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 768Mi
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: tmp
          mountPath: /tmp
        - name: next-cache
          mountPath: /app/.next/cache
      volumes:
      - name: tmp
        emptyDir:
          sizeLimit: 64Mi
      - name: next-cache
        emptyDir:
          sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: tickety
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - protocol: TCP
      name: http
      port: 17000
      targetPort: 3000
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-ingress
  namespace: tickety
spec:
  ingressClassName: traefik
  rules:
    - host: tickety.nexora.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 17000
